name: Build Modules

on:
  workflow_call:
    inputs:
      from_ci:
        type: boolean
        required: false
        default: true

  workflow_dispatch:
    inputs:
      from_ci:
        description: "Only release when a new patches version is available"
        type: boolean
        required: false
        default: false

jobs:
  run:
    # Serialise scheduled and manual runs so two jobs cannot claim the same tag.
    concurrency:
      group: build-modules
      cancel-in-progress: false
    permissions: write-all
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "25"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Update config
        id: prepare
        if: ${{ inputs.from_ci }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "has_update=false" >> "$GITHUB_OUTPUT"
          if git checkout origin/update build.md; then
            UPDATE_CFG=$(./build.sh config.toml --config-update)
            if [ -n "$UPDATE_CFG" ]; then
              echo "$UPDATE_CFG" > config.json
              echo "has_update=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "first time building!"
            echo "has_update=true" >> "$GITHUB_OUTPUT"
          fi

      # Manual Build Modules runs always release. Runs started by CI only
      # release when build.md does not already contain the current patches
      # release, so a CLI-only change cannot create a duplicate release.
      - name: Decide whether to release
        id: release
        run: |
          SHOULD_RELEASE=true
          if [ "${{ inputs.from_ci }}" = "true" ] && [ "${{ steps.prepare.outputs.has_update }}" != "true" ]; then
            SHOULD_RELEASE=false
            echo "No new patches version; skipping build and release."
          fi
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Get next version code
        id: next_ver_code
        if: ${{ steps.release.outputs.should_release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list --limit 1000 --json tagName --jq '.[].tagName' 2>/dev/null \
            | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)
          TAG=${TAG:-0}
          echo "NEXT_VER_CODE=$((10#${TAG} + 1))" >> "$GITHUB_OUTPUT"

      - name: Build modules/APKs
        if: ${{ steps.release.outputs.should_release == 'true' }}
        run: |
          if [ -f config.json ]; then
            ./build.sh config.json
          else
            ./build.sh config.toml
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_VER_CODE: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}

      - name: Get output
        id: get_output
        if: ${{ steps.release.outputs.should_release == 'true' }}
        run: |
          DELIM="$(openssl rand -hex 8)"
          echo "BUILD_LOG<<${DELIM}" >> "$GITHUB_OUTPUT"
          cat build.md >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"
          cp -f build.md build.tmp

      - name: Upload release
        if: ${{ steps.release.outputs.should_release == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
          BODY: ${{ steps.get_output.outputs.BUILD_LOG }}
        run: |
          ls -lh ./build/*
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Release" --notes "$BODY"
            gh release upload "$TAG" ./build/* --clobber
          else
            gh release create "$TAG" ./build/* --title "Release" --notes "$BODY"
          fi

      - name: Update modules changelog and update json
        id: update_config
        if: ${{ steps.release.outputs.should_release == 'true' }}
        env:
          NEXT_VER_CODE: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
        run: |
          git checkout -f update || git switch --discard-changes --orphan update
          cp -f build.tmp build.md

          CHANGELOG="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/update/build.md"
          cd build || { echo "build folder not found"; exit 1; }
          for OUTPUT in *module*.zip; do
            [ "$OUTPUT" = "*module*.zip" ] && continue
            if ! ZIP_S=$(unzip -p "$OUTPUT" module.prop 2>/dev/null); then continue; fi
            UPDATE_JSON=$(echo "$ZIP_S" | grep '^updateJson=' | cut -d= -f2-)
            [ -z "$UPDATE_JSON" ] && continue
            UPDATE_JSON_NAME="${UPDATE_JSON##*/}"
            VER=$(echo "$ZIP_S" | grep '^version=' | cut -d= -f2-)
            DLURL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${NEXT_VER_CODE}/${OUTPUT}"
            jq -n \
              --arg version "$VER" \
              --argjson versionCode "$NEXT_VER_CODE" \
              --arg zipUrl "$DLURL" \
              --arg changelog "$CHANGELOG" \
              '{version: $version, versionCode: $versionCode, zipUrl: $zipUrl, changelog: $changelog}' \
              > "../${UPDATE_JSON_NAME}"
          done
          cd ..

          if ! find . -name "*-update.json" | grep -q .; then
            : >dummy-update.json
          fi

      - name: Commit module json changes
        if: ${{ steps.release.outputs.should_release == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f build.md *-update.json

          if ! git diff --cached --quiet; then
            git commit -s -m "Bump version ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}"
            git push origin HEAD:update
          else
            echo "no changes!"
          fi

      - name: Report to Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          # TG_CHAT must be a numeric chat ID or @channelusername. The
          # TG_BOTNAME fallback keeps older repository variable names working.
          TG_CHAT: ${{ vars.TG_CHAT_ID || vars.TG_BOTNAME }}
        if: ${{ steps.release.outputs.should_release == 'true' && env.TG_TOKEN != '' && env.TG_CHAT != '' }}
        run: |
          cd build || { echo "build folder not found"; exit 1; }

          NL=$'\n'
          APKS=""
          MODULES=""
          for OUTPUT in *; do
            DL_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}/${OUTPUT}"
            if [[ $OUTPUT = *.apk ]]; then
              APKS+="${NL}📦 [${OUTPUT}](${DL_URL})"
            elif [[ $OUTPUT = *.zip ]]; then
              MODULES+="${NL}📦 [${OUTPUT}](${DL_URL})"
            fi
          done
          if [ -n "$MODULES" ]; then
            MODULES="Modules:${NL}${MODULES#"$NL"}"
            if [ -n "$APKS" ]; then MODULES+=${NL}${NL}; fi
          fi
          if [ -n "$APKS" ]; then APKS="APKs:${NL}${APKS#"$NL"}"; fi

          BODY="$(cat ../build.md)"
          RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}"
          MSG="*New Build Released! 🎉*

          ${BODY}

          *▼ Download Links:*
          ${MODULES}${APKS}

          *By shivanshbansal (github.com/NullDonut)*

          *🌟 Check out the builder source:*
          https://github.com/${GITHUB_REPOSITORY}

          *Full release notes:* ${RELEASE_URL}
          "
          echo "Sending Telegram message (${#MSG} characters)"

          POST="https://api.telegram.org/bot${TG_TOKEN}/sendMessage"
          # sendMessage rejects bodies over 4096 characters, so split on line
          # boundaries and fail the step if Telegram rejects any chunk.
          MAX=4000
          send_chunk() {
            local text=$1 resp
            if ! resp=$(curl -sS --fail-with-body -X POST \
              --data-urlencode "parse_mode=Markdown" \
              --data-urlencode "disable_web_page_preview=true" \
              --data-urlencode "text=${text}" \
              --data-urlencode "chat_id=${TG_CHAT}" \
              "$POST"); then
              echo "Telegram request failed: ${resp}" >&2
              return 1
            fi
            if [ "$(jq -r '.ok // false' <<<"$resp")" != "true" ]; then
              echo "Telegram API rejected the message: ${resp}" >&2
              return 1
            fi
          }

          remaining=$MSG
          while [ -n "$remaining" ]; do
            chunk=${remaining:0:$MAX}
            if [ "${#remaining}" -gt "$MAX" ] && [[ $chunk == *$'\n'* ]]; then
              chunk=${chunk%$'\n'*}
            fi
            # A single line longer than MAX still needs to make progress.
            [ -n "$chunk" ] || chunk=${remaining:0:$MAX}
            send_chunk "$chunk"
            remaining=${remaining:${#chunk}}
            remaining=${remaining#$'\n'}
          done
