name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */1 * * *"

jobs:
  check:
    # Reading the update branch needs contents; purging old runs needs actions.
    permissions:
      contents: read
      actions: write
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: "zulu"
          java-version: "25"

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Should build? (new patches version only)
        id: should_build
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git checkout origin/update build.md; then
            echo "first time building!"
            echo "SHOULD_BUILD=1" >> "$GITHUB_OUTPUT"
          else
            # Only a new patches version triggers a CI build/release. Rebuilds
            # with the same version are manual (Build Modules workflow).
            UPDATE_CFG=$(./build.sh config.toml --config-update)
            if [ -n "$UPDATE_CFG" ]; then
              echo "SHOULD_BUILD=1" >> "$GITHUB_OUTPUT"
            else
              echo "SHOULD_BUILD=0" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Clear older runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list -L400 --json databaseId -q '.[].databaseId' | tail -n+10 | xargs -IID gh api "repos/$GITHUB_REPOSITORY/actions/runs/ID" -X DELETE || :

    outputs:
      SHOULD_BUILD: ${{ steps.should_build.outputs.SHOULD_BUILD }}

  build:
    permissions:
      contents: write
    needs: check
    uses: ./.github/workflows/build.yml
    if: ${{ needs.check.outputs.SHOULD_BUILD == 1 }}
    secrets: inherit
