[YT-Music]
inherits = "Base"
app-name = "YT Music"
version = "auto"
arch = "arm64-v8a"
direct-dlurl = "https://github.com/example/apks/releases/download/1/com.google.android.apps.youtube.music-9.20.53-arm64-v8a.apk"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.apps.youtube.music"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube-music"

