cli-source = "MorpheApp/morphe-cli"
cli-version = "dev"
patches-version = "dev"
rv-brand = "Morphe-dev"
build-mode = "both"
patcher-args = "-e 'Custom branding' -OappIcon=original"
version = "auto"     # 'auto', 'experimental', 'latest' or a version number (e.g. '17.40.41'). default: auto

